<title>벨벳 카지노</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 화면 하나씩 갈아 끼우는 구조(입구 → 로비 → 테이블/상점/친구 방).

:root {
  color-scheme: dark;
  --ink: #0e0b0a;
  --lacquer: #17110f;
  --velvet: #3d0f1d;

  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;

}
[hidden] { display: none !important; }
* { box-sizing: border-box; }

.door-panel.l::after { right: 18px; } .door-panel.r::after { left: 18px; }

.sign { position: relative; z-index: 2; text-align: center; display: grid; gap: 14px; justify-items: center; transition: opacity .5s; padding: 28px 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(14,11,10,.72); backdrop-filter: blur(2px); max-width: 520px; }

#scrTable { overflow-x: clip; }
