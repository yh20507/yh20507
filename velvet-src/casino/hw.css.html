<style>
/* ── 할로윈 이벤트 ── */
:root { --hw-orange: #ff8a2a; --hw-purple: #8e5bd6; --hw-ink: #120a1a; --g-n: #cfd3da; --g-r: #b58ad9; --g-l: #ecc66a; --g-u: #ff4d6d; --g-e: #ff9a3d; }

/* 위쪽 막대: 사탕, 초상화 */
.hw-candy { border: 1px solid rgba(255,138,42,.45); background: rgba(255,138,42,.08); border-radius: 999px; padding: 4px 10px 4px 8px; cursor: pointer; color: var(--hw-orange); gap: 6px; min-height: 34px; }
.hw-candy b { color: #ffd9b0; }
.hw-candy:hover { border-color: var(--hw-orange); }
.hw-float { position: fixed; z-index: 75; transform: translateX(-50%); font: 700 14px var(--f-num); color: var(--hw-orange); pointer-events: none; animation: hwFloat 1.2s ease-out forwards; text-shadow: 0 1px 4px #000; }
@keyframes hwFloat { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: 26px; } }

/* 초상화와 테두리 */
.hw-pt { --s: 34px; position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 22%; flex: none; vertical-align: middle;
  background: #1b1320; box-shadow: 0 0 0 2px var(--brass), 0 2px 6px rgba(0,0,0,.5); }
.hw-pt img, .hw-pt .hw-pt-blank { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
.hw-pt .hw-pt-blank { background: radial-gradient(circle at 50% 38%, #4a3b55 0 18%, transparent 19%), radial-gradient(ellipse at 50% 100%, #4a3b55 0 42%, transparent 43%), #241a2c; }
.nm .hw-pt { margin-right: 5px; vertical-align: -6px; }
.hw-pt.fr_vine { box-shadow: 0 0 0 2px #3d7a2f, 0 0 0 4px var(--hw-orange), 0 2px 6px rgba(0,0,0,.5); }
.hw-pt.fr_vine::before, .hw-pt.fr_vine::after { content: ""; position: absolute; width: 34%; height: 30%; border-radius: 45%; background: radial-gradient(circle at 50% 60%, #ffb15c, var(--hw-orange) 55%, #b4520e); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.hw-pt.fr_vine::before { left: -12%; top: -12%; } .hw-pt.fr_vine::after { right: -12%; bottom: -12%; }
.hw-pt.fr_web { box-shadow: 0 0 0 2px #cfd3da, 0 0 0 4px #2a2433, 0 2px 6px rgba(0,0,0,.5); }
.hw-pt.fr_web::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 0 0, rgba(230,230,240,.85) 0 2deg, transparent 2deg 22deg), repeating-radial-gradient(circle at 0 0, transparent 0 7px, rgba(230,230,240,.7) 7px 8px);
  -webkit-mask: radial-gradient(circle at 0 0, #000 0 45%, transparent 46%); mask: radial-gradient(circle at 0 0, #000 0 45%, transparent 46%); }
.hw-pt.fr_bone { box-shadow: 0 0 0 3px #efe6cf, 0 0 0 5px #6d6252, 0 2px 6px rgba(0,0,0,.5); }
.hw-pt.fr_bone::before, .hw-pt.fr_bone::after { content: ""; position: absolute; left: -8%; right: -8%; height: 12%; border-radius: 999px; background: #efe6cf;
  box-shadow: -2px 0 0 1px #efe6cf, 2px 0 0 1px #efe6cf; }
.hw-pt.fr_bone::before { top: -9%; } .hw-pt.fr_bone::after { bottom: -9%; }
.hw-pt.fr_flame { box-shadow: 0 0 0 2px #c79be8, 0 0 10px 3px rgba(162,92,255,.85), 0 0 22px 6px rgba(120,40,220,.45); animation: hwFlame 1.4s ease-in-out infinite alternate; }
@keyframes hwFlame { to { box-shadow: 0 0 0 2px #e2c8f5, 0 0 14px 5px rgba(182,112,255,.95), 0 0 30px 10px rgba(140,60,240,.5); } }

/* 카드 테마: 트럼프·화투 뒷면, 슬롯 테두리, 룰렛 가운데 */
html.hw-cb .card.back { background: var(--hw-cardback) center / 100% 100%; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
html.hw-cb .hw.back { background: var(--hw-cardback) center / 100% 100%; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
html.hw-cb .machine { border: 16px solid transparent; border-image: var(--hw-cardback) 14% / 16px stretch; }
.hub-ring { fill: none; stroke: var(--brass); stroke-width: 3; }

/* 테이블 무늬 */
html.hw-tb .felt, html.hw-tb .pfelt, html.hw-tb #scrTable.under .felt, html.hw-tb .bc-table {
  background: radial-gradient(ellipse at 50% 45%, rgba(8,4,12,.2) 30%, rgba(8,4,12,.72) 88%), linear-gradient(rgba(8,4,12,.32), rgba(8,4,12,.32)), var(--hw-table) center / cover; }

/* 입구 */
#door.halloween { background: linear-gradient(180deg, rgba(14,6,24,.25), rgba(14,6,24,.7)), url("hw/door.webp") center / cover, #120a1a; }
#door.halloween .door-panel { display: none; }
#door.halloween .sign { background: rgba(18,8,26,.72); border-color: rgba(255,138,42,.45); }
#door.halloween .sign .deco { color: #ffb35c; text-shadow: 0 0 18px rgba(255,138,42,.65), 0 0 2px #fff1d8; }
#door.halloween .sign .rule { background: linear-gradient(90deg, transparent, var(--hw-orange) 20%, var(--hw-orange) 80%, transparent); }
#door.halloween .dress::after { content: " · Halloween"; color: var(--hw-orange); }
#door.hw-opening .sign { opacity: 0; transition: opacity .35s; }
.hw-flock { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.hw-flock img { position: absolute; left: 50%; top: 50%; width: 90px; margin: -24px 0 0 -45px; opacity: 0; image-rendering: pixelated;
  animation: hwFly 1.25s cubic-bezier(.35,.1,.6,1) var(--dl) forwards; }
@keyframes hwFly {
  0% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.25); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(var(--fx) * -.25), calc(var(--fy) * -.25)) scale(calc(var(--sc) * 3.2)); } }

/* 로비: 위자 보드 배너 */
.hw-banner { position: relative; display: grid; place-items: end center; width: 100%; min-height: 230px; margin: 14px 0 6px; padding: 0 16px 18px; overflow: hidden; cursor: pointer;
  border: 1px solid rgba(255,138,42,.55); border-radius: 18px; color: var(--ivory); text-align: center;
  background: radial-gradient(ellipse at 50% 55%, rgba(20,8,4,.05), rgba(20,8,4,.55) 80%), url("hw/ouija.webp") center 48% / cover, #3a2112;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.45); }
.hw-banner:hover { border-color: var(--hw-orange); }
.hw-oj { position: absolute; inset: 8px 8px auto; height: 74%; pointer-events: none; }
.hw-oj svg { width: 100%; height: 100%; }
.oj { font-family: var(--f-deco); font-size: 58px; fill: rgba(246,224,184,.82); stroke: rgba(40,16,4,.7); stroke-width: 2px; paint-order: stroke; letter-spacing: .02em; }
.oj.s { font-size: 44px; fill: rgba(255,179,92,.9); }
.hw-planchette { position: absolute; left: 50%; top: 22%; width: 54px; height: 64px; margin-left: -27px; pointer-events: none;
  background: radial-gradient(circle at 50% 42%, transparent 0 9px, rgba(40,20,8,.9) 10px 12px, transparent 13px), linear-gradient(#e9d6b2, #c9ad7f);
  clip-path: path("M27 0 C46 0 54 24 54 40 C54 54 44 64 27 64 C10 64 0 54 0 40 C0 24 8 0 27 0 Z"); opacity: .85; box-shadow: 0 4px 10px rgba(0,0,0,.5);
  animation: hwPlan 9s ease-in-out infinite; }
@keyframes hwPlan { 0%, 100% { transform: translate(-180px, 10px) rotate(-12deg); } 30% { transform: translate(60px, -14px) rotate(6deg); } 60% { transform: translate(190px, 18px) rotate(14deg); } 80% { transform: translate(-40px, 0) rotate(-4deg); } }
.hw-plaque { position: relative; display: grid; gap: 2px; justify-items: center; padding: 10px 22px; border-radius: 14px; background: rgba(18,8,26,.82); border: 1px solid rgba(255,138,42,.5); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.hw-plaque small { font: 600 11px var(--f-num); letter-spacing: .3em; color: var(--hw-orange); }
.hw-plaque b { font-family: var(--f-display); font-size: 24px; color: #ffe2bf; }
.hw-plaque span { font-size: 13px; color: #d9c7e8; }
@media (max-width: 640px) { .hw-banner { min-height: 200px; } .hw-planchette { display: none; } }
.door-card.d-hw { --dc: var(--hw-orange); background: linear-gradient(135deg, #2a1236, #170c1e); border-color: rgba(255,138,42,.45); }
.door-card.d-hw b { color: #ffcf9c; }

/* 접속 팝업 */
.hw-popimg { width: 100%; max-height: 42vh; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,138,42,.4); }
.hw-poplist { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: #d8ccb3; }

/* 축제 화면 */
.hw-screen .plus-head h1 { color: #ffcf9c; }
.hw-gacha { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 22px; align-items: center; padding: 18px; border-radius: 18px; border: 1px solid rgba(255,138,42,.4);
  background: radial-gradient(circle at 20% 60%, rgba(142,91,214,.28), transparent 55%), linear-gradient(180deg, #1d1028, #120a1a); }
@media (max-width: 760px) { .hw-gacha { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } .hw-gacha .actions, .hw-gacha .row { justify-content: center; } }
.hw-cauldron { position: relative; width: min(340px, 100%); aspect-ratio: 1; border-radius: 16px; overflow: hidden; }
.hw-cauldron img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; -webkit-mask: radial-gradient(circle at 50% 52%, #000 58%, transparent 71%); mask: radial-gradient(circle at 50% 52%, #000 58%, transparent 71%); }
.hw-cauldron .bub { position: absolute; left: var(--x); top: 44%; width: 10px; height: 10px; background: #c79bff; box-shadow: 0 0 6px #b27bff; opacity: 0; animation: hwBub 1.6s ease-in var(--d) infinite; }
@keyframes hwBub { 0% { opacity: 0; transform: translateY(0) scale(.6); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-70px) scale(1.1); } }
.hw-cauldron.brew img { animation: hwBrew .12s linear infinite alternate; }
.hw-cauldron.brew .bub { animation-duration: .7s; }
.hw-cauldron.brew::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, rgba(190,120,255,.75), transparent 45%); animation: hwGlow 1.1s ease-in forwards; }
@keyframes hwBrew { from { transform: rotate(-1.2deg) translateY(1px); } to { transform: rotate(1.2deg) translateY(-1px); } }
@keyframes hwGlow { from { opacity: 0; } to { opacity: 1; } }
.hw-gside { display: grid; gap: 12px; min-width: 0; }
.hw-candybig { display: flex; align-items: baseline; gap: 8px; color: var(--hw-orange); }
.hw-candybig span { align-self: center; display: inline-grid; }
.hw-candybig b { font: 700 40px var(--f-num); color: #ffe2bf; }
.hw-candybig small { color: var(--muted); }
.hw-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
@media (max-width: 760px) { .hw-cols { grid-template-columns: minmax(0, 1fr); } }
.hw-ms { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid rgba(201,161,74,.15); }
.hw-ms > div { display: grid; gap: 4px; min-width: 0; flex: 1; }
.hw-ms b { font-size: 14.5px; } .hw-ms small { font-size: 12px; color: var(--muted); }
.hw-ms.got b { color: var(--muted); text-decoration: line-through; }
.hw-prog { display: block; height: 6px; border-radius: 3px; background: #2b211d; overflow: hidden; }
.hw-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--hw-purple), var(--hw-orange)); }
.hw-bag { display: grid; gap: 10px; }
.hw-ev { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hw-ev .ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,138,42,.12); color: var(--hw-orange); }
.hw-ev b { font-size: 14.5px; display: block; } .hw-ev small { font-size: 12px; color: var(--muted); }
.hw-select { background: #120d0b; color: var(--ivory); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 14px var(--f-body); width: 100%; }

/* 뽑기 결과 */
.hw-pull { position: fixed; inset: 0; z-index: 85; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; overflow-y: auto;
  background: radial-gradient(circle at 50% 45%, rgba(60,24,90,.92), rgba(6,3,10,.96) 70%); animation: fadein .25s; }
.hw-pull h2 { color: #ffcf9c; text-align: center; }
.hw-pull > :first-child { margin-top: auto; } .hw-pull > :last-child { margin-bottom: auto; }
.hw-pull.one > .hw-burst { position: fixed; left: 50%; top: 50%; width: min(520px, 120vw); height: min(520px, 120vw); margin: calc(min(520px, 120vw) / -2) 0 0 calc(min(520px, 120vw) / -2); }
.hw-pull.one > .hw-flip { margin-top: auto; }
.hw-pull .actions { justify-content: center; }
.hw-sum { text-align: center; margin: 0; }
.hw-grid { display: grid; grid-template-columns: repeat(6, 118px); gap: 10px; justify-content: center; }
@media (max-width: 820px) { .hw-grid { grid-template-columns: repeat(4, 104px); } }
@media (max-width: 480px) { .hw-grid { grid-template-columns: repeat(3, minmax(0, 104px)); } }
.hw-flip { position: relative; width: 118px; height: 170px; perspective: 900px; }
@media (max-width: 820px) { .hw-flip { width: 104px; height: 152px; } }
.hw-flip.big { width: min(240px, 70vw); height: min(340px, 99vw); }
.hw-back, .hw-face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.hw-back { background: repeating-linear-gradient(45deg, rgba(236,210,142,.35) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(236,210,142,.35) 0 2px, transparent 2px 9px), linear-gradient(var(--velvet-hi), var(--velvet));
  box-shadow: inset 0 0 0 3px #f2e5c2, inset 0 0 0 4px var(--brass), 0 6px 18px rgba(0,0,0,.6); }
html.hw-cb .hw-back { background: var(--hw-cardback) center / 100% 100%; box-shadow: 0 6px 18px rgba(0,0,0,.6); }
.hw-face { transform: rotateY(180deg); display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; align-items: center; gap: 4px; padding: 8px 6px 10px; text-align: center;
  background: linear-gradient(180deg, #2a1d30, #160f1c); border: 2px solid var(--gc, var(--g-n)); box-shadow: 0 0 18px -4px var(--gc, transparent), 0 6px 18px rgba(0,0,0,.6); }
.hw-flip.open .hw-back { transform: rotateY(-180deg); }
.hw-flip.open .hw-face { transform: rotateY(0); }
.hw-face.g-n { --gc: var(--g-n); } .hw-face.g-r { --gc: var(--g-r); } .hw-face.g-l { --gc: var(--g-l); } .hw-face.g-e { --gc: var(--g-e); }
.hw-face.g-u { --gc: var(--g-u); border-image: linear-gradient(135deg, #ff4d6d, #ffb35c, #ffe26b, #7be08f, #6bc7ff, #b27bff, #ff4d6d) 1; }
.hw-face.g-l, .hw-face.g-u { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gc) 30%, transparent), transparent 65%), linear-gradient(180deg, #2a1d30, #160f1c); }
.hw-grade { font: 600 10.5px var(--f-num); letter-spacing: .12em; color: var(--gc); }
.hw-face b { font-size: 13px; line-height: 1.25; }
.hw-face em { font-style: normal; font-size: 10.5px; color: var(--muted); }
.hw-face em.new { color: var(--gc); font-weight: 600; }
.hw-flip.big .hw-face b { font-size: 18px; } .hw-flip.big .hw-grade { font-size: 12px; } .hw-flip.big .hw-face em { font-size: 12.5px; }
.hw-flip.pre-r:not(.open) .hw-back { box-shadow: 0 0 16px 2px rgba(181,138,217,.7), 0 6px 18px rgba(0,0,0,.6); }
.hw-flip.pre-l:not(.open) .hw-back { box-shadow: 0 0 20px 4px rgba(236,198,106,.85), 0 6px 18px rgba(0,0,0,.6); animation: hwPulse .8s ease-in-out infinite alternate; }
.hw-flip.pre-u:not(.open) .hw-back { box-shadow: 0 0 24px 6px rgba(255,77,109,.9), 0 6px 18px rgba(0,0,0,.6); animation: hwPulse .5s ease-in-out infinite alternate; }
@keyframes hwPulse { to { filter: brightness(1.35); } }
.hw-burst { position: absolute; width: 520px; height: 520px; max-width: 120vw; max-height: 120vw; border-radius: 50%; pointer-events: none; opacity: 0; animation: hwBurst 1s ease-out .15s forwards;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--gc, #fff) 45%, transparent) 0 8deg, transparent 8deg 20deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); }
.hw-pull.g-r { --gc: var(--g-r); } .hw-pull.g-l { --gc: var(--g-l); } .hw-pull.g-u { --gc: var(--g-u); } .hw-pull.g-e { --gc: var(--g-e); } .hw-pull.g-n .hw-burst { display: none; }
@keyframes hwBurst { from { opacity: 0; transform: scale(.4) rotate(0); } 30% { opacity: 1; } to { opacity: .55; transform: scale(1) rotate(40deg); } }
.hw-pull.ultra { background: #000; }
.hw-pull.ultra > * { visibility: hidden; }
.hw-pull.ultra::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255,40,80,.0), rgba(255,40,80,.35)); animation: hwRed .5s ease-in-out infinite alternate; }
.hw-pull.ultra::after { content: "초레어"; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 clamp(40px, 12vw, 96px) var(--f-display); letter-spacing: .1em;
  background: linear-gradient(90deg, #ff4d6d, #ffb35c, #ffe26b, #7be08f, #6bc7ff, #b27bff); -webkit-background-clip: text; background-clip: text; color: transparent; animation: hwUltra 1.5s ease-in forwards; }
@keyframes hwRed { to { background: radial-gradient(circle at 50% 50%, rgba(255,40,80,.1), rgba(255,40,80,.6)); } }
@keyframes hwUltra { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); filter: blur(2px); } }
.hw-pull.ultra-burst::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: conic-gradient(#ff4d6d, #ffb35c, #ffe26b, #7be08f, #6bc7ff, #b27bff, #ff4d6d); animation: hwFlashOut .6s ease-out forwards; }
@keyframes hwFlashOut { from { opacity: .9; } to { opacity: 0; } }
body.hw-shake { animation: hwShake .09s linear infinite; }
@keyframes hwShake { 0% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 2px); } 100% { transform: translate(1px, 1px); } }

/* 썸네일 */
.hw-thumb { display: grid; place-items: center; width: 100%; min-height: 0; height: 100%; overflow: hidden; }
.hw-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
.hw-thumb.s-card img { height: 100%; border-radius: 6px; }
.hw-thumb.s-luna img { height: 100%; }
.hw-thumb.s-noel img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; border-radius: 8px; }
.hw-thumb.s-table i { display: block; width: 100%; height: 100%; min-height: 60px; border-radius: 40% / 50%; background-size: cover; background-position: center; box-shadow: inset 0 0 14px rgba(0,0,0,.6); }
.hw-thumb .hw-pt { --s: min(84px, 100%); width: min(84px, 90%); height: auto; aspect-ratio: 1; }
.hw-flip.big .hw-thumb .hw-pt { width: 150px; }
.hw-flip.big .hw-thumb.s-ico svg { width: 110px; height: 110px; } .hw-flip.big .chip-ico.big { width: 96px; height: 96px; }
.hw-thumb .fxi { display: grid; place-items: center; width: 64px; height: 64px; color: var(--hw-orange); }
.hw-thumb .fxi img { width: 64px; } .hw-thumb .fxi svg { width: 52px; height: 52px; }
.hw-thumb.s-ico { color: var(--brass-hi); } .hw-thumb.s-ico.ev { color: var(--hw-orange); }
.chip-ico.big { width: 46px; height: 46px; }
.hw-thumb.lockq { font: 700 34px var(--f-display); color: rgba(255,255,255,.18); background: rgba(0,0,0,.3); border-radius: 10px; }

/* 옷장 */
.hw-closet-top { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 16px; }
.hw-closet-top > div { display: grid; gap: 6px; justify-items: start; }
.hw-wardrobe { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.hw-cos { display: grid; grid-template-rows: 120px auto auto; gap: 4px; justify-items: center; text-align: center; padding: 8px; border-radius: 12px; cursor: pointer; min-width: 0;
  border: 1px solid color-mix(in srgb, var(--gc) 55%, transparent); background: linear-gradient(180deg, #221626, #150e18); }
.hw-cos b { font-size: 13px; line-height: 1.25; } .hw-cos small { font-size: 11px; color: var(--gc); }
.hw-cos.g-n { --gc: var(--g-n); } .hw-cos.g-r { --gc: var(--g-r); } .hw-cos.g-l { --gc: var(--g-l); } .hw-cos.g-u { --gc: var(--g-u); }
.hw-cos.on { outline: 2px solid var(--gc); outline-offset: 2px; box-shadow: 0 0 14px -2px var(--gc); }
.hw-cos.lock { cursor: default; opacity: .55; }
.hw-cos:not(.lock):hover { border-color: var(--gc); }

/* 승리 효과 */
