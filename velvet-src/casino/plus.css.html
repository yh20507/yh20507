/* ── 미니 업데이트: 회전판 ── */
.d-k { --dc: #3a7bd5; } .d-l { --dc: #e0b030; } .d-u { --dc: #5a6b5a; background: linear-gradient(160deg, rgba(255,255,255,.03), transparent 50%), linear-gradient(180deg, #121614, #0a0c0b); }
