<script>
/* ===== 벨벳 카지노 · 친구 테이블 =====
   방장의 브라우저가 딜러를 맡는다. 판 상태(공개 정보)는 모두에게 보내고,
   각자의 숨은 카드는 그 사람만 풀 수 있게 암호화해서 보낸다. */
const Friends = (() => {
  const C = Cas, A = App, h = A.h, $ = A.$;
  const MT = {
    holdem: { name: '친구', sb: 5, bb: 10, unit: 10, start: 1000 },
    seven: { name: '친구', ante: 5, unit: 10, start: 1000 },
    blackjack: { name: '친구', minBet: 10, maxBet: 200, chips: [10, 25, 50, 100], start: 1000 }
  };
  const TURN_MS = 30000, BET_MS = 25000, NEXT_MS = 6000;
  let lobby = null, user = null, myUid = null, lobbyPeer = null, ready = false;
  let pub = null, kp = null;
  let unsubPeers = null;

  // ── 암호 ──
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function keys() {
    if (kp) return;
    kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']);
    const j = await crypto.subtle.exportKey('jwk', kp.publicKey);
    pub = { x: j.x, y: j.y };
  }
  async function derive(other) {
    const pk = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: other.x, y: other.y, ext: true }, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    return crypto.subtle.deriveKey({ name: 'ECDH', public: pk }, kp.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function enc(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function dec(key, m) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(m.iv) }, key, unb64(m.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function init() {
    if (ready) return !!lobby;
    ready = true;
    try {
      const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
      if (!use) return false;
      [lobby, user] = await Promise.all([use('room'), use('user')]);
      myUid = user ? await user.id() : null;
      if (lobby) {
        unsubPeers = lobby.onPeers((ch) => {
          for (const p of ch.peers) if (p.isMe && p.sameTab) lobbyPeer = p.peer;
          if (!$('#scrFriends').hidden) renderList();
        }, () => {});
        await keys();
      }
    } catch (e) { lobby = null; }
    return !!lobby;
  }

  // ════════ 친구 로비 ════════
  async function open() {
    const el = $('#scrFriends'); el.innerHTML = '';
    el.append(h('div', { class: 'lobby-head' }, h('h1', { text: '친구 테이블' }),
      h('p', { class: 'sub', text: '방을 만들면 방 코드가 생겨요. 친구가 이 카지노 링크를 열고 친구 테이블에서 그 방을 고르면 같이 앉을 수 있어요. 빈자리는 AI 손님이 채워요.' })));
    A.show('scrFriends');
    const ok = await init();
    if (!ok) {
      el.append(h('div', { class: 'panel' }, h('h3', { text: '지금은 친구 테이블을 열 수 없어요' }),
        h('p', { class: 'note', text: '친구 테이블은 Claude 앱이나 claude.ai에서 이 카지노를 열었을 때만 돼요. 친구도 같은 링크로 들어와야 하고, 공유 설정에서 친구에게 "사용 가능(Contributor)" 이상의 권한을 줘야 같이 앉을 수 있어요.' })));
      return;
    }
    const make = h('div', { class: 'panel' }, h('h3', { text: '방 만들기' }),
      h('p', { class: 'note', text: '모두 1,000 테이블 칩으로 시작해요. 내 지갑 칩은 쓰지 않고, 아이템도 쓸 수 없어요. 내가 딜러를 맡으니 내가 나가면 방이 닫혀요.' }),
      h('div', { class: 'row' },
        h('button', { class: 'btn gold small', text: '홀덤 방', onclick: () => host('holdem') }),
        h('button', { class: 'btn gold small', text: '세븐 포커 방', onclick: () => host('seven') }),
        h('button', { class: 'btn gold small', text: '블랙잭 방', onclick: () => host('blackjack') })));
    const code = h('input', { type: 'text', id: 'joinCode', maxlength: '6', placeholder: '방 코드', autocomplete: 'off', 'aria-label': '방 코드' });
    const joinBox = h('div', { class: 'panel' }, h('h3', { text: '코드로 들어가기' }), code,
      h('button', { class: 'btn', text: '들어가기', onclick: () => joinCode(code.value.trim().toLowerCase()) }));
    const listBox = h('div', { class: 'panel' }, h('h3', { text: '지금 열린 방' }), h('div', { class: 'tables-list', id: 'fList' }));
    el.append(h('div', { class: 'side' }, make, joinBox, listBox),
      h('p', { class: 'note', style: 'margin-top:14px', text: '친구를 부르려면 이 카지노의 공유 메뉴에서 친구를 초대하고 권한을 "사용 가능" 이상으로 주세요. 보기 전용 권한으로는 테이블에 앉을 수 없어요.' }));
    renderList();
  }
  function hosts() {
    if (!lobby) return [];
    return lobby.peers().filter((p) => p.presence && p.presence.host && typeof p.presence.host.code === 'string' && !(p.isMe && p.sameTab));
  }
  async function renderList() {
    const box = $('#fList'); if (!box) return;
    box.innerHTML = '';
    const hs = hosts();
    if (!hs.length) { box.append(h('p', { class: 'note', text: '열린 방이 아직 없어요. 친구가 방을 만들면 여기 나타나요.' })); return; }
    const names = user ? await user.profiles(hs.map((p) => p.by).filter(Boolean)) : {};
    for (const p of hs) {
      const ho = p.presence.host, g = A.GAMES[ho.game] ? ho.game : 'holdem';
      const nm = (p.by && names[p.by] && names[p.by].name) || '친구';
      box.append(h('div', { class: 'trow' },
        h('div', null, h('b', { text: A.GAMES[g].name }), ' · ', nm + '의 방 · ', h('span', { class: 'code', text: String(ho.code).slice(0, 6) })),
        h('button', { class: 'btn small gold', text: '앉기', onclick: () => join(String(ho.code).slice(0, 6), p.peer, g) })));
    }
  }
  function joinCode(code) {
    if (!/^[a-z0-9]{4,6}$/.test(code)) return A.toast('방 코드를 확인해 주세요.');
    const p = hosts().find((x) => x.presence.host.code === code);
    if (!p) return A.toast('그 코드의 방을 찾지 못했어요. 방장이 방을 열어 두었는지 확인해 주세요.');
    join(code, p.peer, p.presence.host.game);
  }

  // ════════ 공통 ════════
  function base(mode, game, code) {
    return {
      mode, game, code, T: Object.assign({}, MT[game], { name: '' }), bubble: null, sel: { discard: -1, open: -1 }, chooser: null, raiseTo: 0, bet: MT[game].minBet || 0,
      names: {}, timerI: null
    };
  }
  async function resolveNames(K, uids) {
    if (!user) return;
    const ids = uids.filter(Boolean);
    if (!ids.length) return;
    const ps = await user.profiles(ids);
    let changed = false;
    for (const id of ids) { const n = ps[id] && ps[id].name; if (n && K.names[id] !== n) { K.names[id] = n; changed = true; } }
    if (changed && A.S === K) A.renderTable();
  }
  function seatNames(K, v, meta) {
    const out = {};
    v.seats.forEach((s, i) => { const m = meta && meta[i]; if (m && m.uid) out[i] = K.names[m.uid] || (m.kind === 'host' ? '방장' : '친구'); });
    return out;
  }
  function timerText(deadline) {
    if (!deadline) return '';
    const s = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    return '(' + s + '초)';
  }
  // 보이는 판에서 내 베팅 가능 범위 계산 (엔진의 legal과 같은 규칙)
  function legalFromView(v, i) {
    const s = v.seats[i];
    if (!s || v.phase !== 'bet' || v.toAct !== i) return null;
    const toCall = Math.max(0, v.curBet - s.bet), call = Math.min(toCall, s.stack), allTo = s.bet + s.stack;
    let minTo = v.curBet + Math.max(v.minRaise, v.unit), maxTo = allTo;
    if (v.game === 'seven') maxTo = Math.min(allTo, v.curBet + v.pot + toCall);
    const canRaise = s.stack > toCall && (v.game !== 'seven' || v.raises < 4) && v.seats.some((o, k) => k !== i && !o.folded && !o.allin);
    if (minTo > maxTo) minTo = maxTo;
    return { toCall, call, canCheck: toCall === 0, canRaise, minTo, maxTo, allTo, pot: v.pot };
  }
  function bjLegalFromView(v, i) {
    if (v.phase !== 'play' || !v.turn || v.turn.seat !== i) return null;
    const s = v.seats[i], hd = s.hands[v.turn.hand]; if (!hd) return null;
    const two = hd.cards.length === 2;
    return { hit: true, stand: true, double: two && s.stack >= hd.bet, split: two && s.hands.length === 1 && C.rankOf(hd.cards[0]) === C.rankOf(hd.cards[1]) && s.stack >= hd.bet };
  }

  // ════════ 방장 ════════
  async function host(game) {
    const code = Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(2, 7).padEnd(5, '7');
    let room;
    try { room = await lobby.join('velvet-' + code); } catch (e) { return A.toast('방을 열지 못했어요. 잠시 뒤 다시 해 보세요.'); }
    await room.presence({ role: 'host', pub, uid: myUid });
    const K = base('host', game, code);
    K.room = room; K.meta = []; K.queue = []; K.seq = 0; K.deadline = 0; K.sent = {};
    const T = K.T;
    if (game === 'blackjack') {
      K.t = C.makeBJ({ minBet: T.minBet, maxBet: T.maxBet, seats: [{ id: 'host', name: '방장', kind: 'human', stack: T.start }] });
      K.meta = [{ kind: 'host', uid: myUid, peer: null }];
    } else {
      const n = A.GAMES[game].seats, seats = [{ id: 'host', name: '방장', kind: 'human', stack: T.start }];
      for (let k = 1; k < n; k++) seats.push(A.newAI(null, seats.map((s) => s.name), T.start));
      K.t = C.makePoker(game, { sb: T.sb, bb: T.bb, ante: T.ante || 0, unit: T.unit, seats });
      K.meta = seats.map((s, i) => (i === 0 ? { kind: 'host', uid: myUid, peer: null } : { kind: 'ai' }));
    }
    lobby.presence({ host: { code, game } }).catch(() => {});
    K.unsubs = [
      room.on('sit', (m) => onSit(K, m)),
      room.on('act', (m) => onAct(K, m)),
      room.on('choose', (m) => onChoose(K, m)),
      room.on('bet', (m) => onBet(K, m)),
      room.on('leave', (m) => onLeave(K, m)),
      room.onPeers((ch) => {
        for (const p of ch.peers) if (p.isMe && p.sameTab) K.myPeer = p.peer;
        for (const p of ch.left) {
          const i = K.meta.findIndex((m) => m.peer === p.peer);
          if (i > 0) { K.meta[i].away = true; K.t.seats[i].away = true; broadcast(K); pump(K); }
        }
        if (ch.joined.length) broadcast(K, true);
      })
    ];
    K.ctx = () => hostCtx(K);
    K.leave = () => closeHost(K);
    K.timerI = setInterval(() => { if (A.S === K && K.deadline) A.renderTable(); }, 1000);
    A.S = K; A.show('scrTable');
    A.toast('방을 열었어요. 방 코드 ' + code + '를 친구에게 알려 주세요.');
    if (game === 'blackjack') bjBetPhase(K); else nextHand(K);
  }

  function hostCtx(K) {
    const t = K.t;
    if (K.game === 'blackjack') {
      const v = C.viewBJ(t);
      return { v, me: 0, game: 'blackjack', names: seatNames(K, v, K.meta), timer: timerText(K.deadline), canBet: (t.phase === 'bet') && !(t.seats[0].bet > 0) && t.seats[0].stack > 0,
        addBet: (n) => { K.bet = Math.max(0, Math.min(K.T.maxBet, t.seats[0].stack, (K.bet || 0) + n)); A.renderTable(); },
        deal: () => { if (C.bjBet(t, 0, K.bet)) { broadcast(K); maybeDeal(K); A.renderTable(); } else A.toast('베팅할 수 없는 금액이에요.'); },
        bjAct: (type) => { if (C.bjAct(t, 0, type)) { afterBJ(K); } }, extra: hostExtra(K) };
    }
    const v = C.viewPoker(t);
    v.seats[0].cards = t.seats[0].cards.slice();
    return { v, me: 0, game: K.game, names: seatNames(K, v, K.meta), timer: timerText(K.deadline), bubbles: K.bubbles,
      act: (type, to) => { if (t.toAct === 0 && C.act(t, 0, { type, to })) { K.raiseTo = 0; after(K); } },
      choose: (d, o) => { if (C.choose(t, 0, d, o)) { K.sel = { discard: -1, open: -1 }; after(K); } },
      extra: hostExtra(K) };
  }
  function hostExtra(K) {
    const humans = K.meta.filter((m) => m.kind === 'host' || m.kind === 'human').length;
    return h('div', { class: 'note' }, '방 코드 ', h('b', { class: 'code', text: K.code }), ' · 사람 ' + humans + '명 앉음' + (K.queue.length ? ' · 다음 판에 ' + K.queue.length + '명 합류' : ''));
  }

  function onSit(K, m) {
    if (m.isMe && m.sameTab) return;
    const peer = m.peer, uid = m.by || null;
    const peerInfo = K.room.peers().find((p) => p.peer === peer);
    const pk = peerInfo && peerInfo.presence && peerInfo.presence.pub;
    // 같은 사람이 다시 들어오면 자리를 돌려준다
    let i = K.meta.findIndex((x) => x.kind === 'human' && ((uid && x.uid === uid) || x.peer === peer));
    if (i > 0) {
      K.meta[i].peer = peer; K.meta[i].away = false; K.t.seats[i].away = false; K.meta[i].pub = pk; K.meta[i].key = null; K.sent[i] = null;
      broadcast(K, true); return;
    }
    if (K.queue.some((q) => q.peer === peer)) return;
    K.queue.push({ peer, uid, pub: pk });
    if (K.game === 'blackjack' && (K.t.phase === 'bet' || K.t.phase === 'done')) seatQueued(K);
    else if (K.t.phase === 'idle' || K.t.phase === 'done') seatQueued(K);
    broadcast(K, true);
    resolveNames(K, [uid]);
  }
  function seatQueued(K) {
    while (K.queue.length) {
      const q = K.queue[0];
      if (K.game === 'blackjack') {
        if (K.t.seats.length >= 5) break;
        K.t.seats.push({ id: 'p' + K.t.seats.length, name: '친구', kind: 'human', stack: K.T.start, bet: 0, hands: [], away: false });
        K.meta.push({ kind: 'human', uid: q.uid, peer: q.peer, pub: q.pub });
      } else {
        const i = K.meta.findIndex((m, k) => k > 0 && (m.kind === 'ai' || (m.kind === 'human' && m.gone)));
        if (i < 0) break;
        Object.assign(K.t.seats[i], { id: 'p' + i, name: '친구', kind: 'human', persona: null, stack: K.T.start, away: false, drunk: 0 });
        K.meta[i] = { kind: 'human', uid: q.uid, peer: q.peer, pub: q.pub };
      }
      K.queue.shift();
    }
  }
  function seatOf(K, m) { return K.meta.findIndex((x) => x.kind === 'human' && x.peer === m.peer); }

  function onAct(K, m) {
    const i = seatOf(K, m), t = K.t, d = m.data || {};
    if (i < 0 || K.game === 'blackjack') {
      if (i >= 0 && K.game === 'blackjack' && t.turn && t.turn.seat === i && ['hit', 'stand', 'double', 'split'].includes(d.type)) { if (C.bjAct(t, i, d.type)) afterBJ(K); }
      return;
    }
    if (t.toAct !== i || d.hand !== t.handNo) return;
    if (!['fold', 'check', 'call', 'raise'].includes(d.type)) return;
    if (C.act(t, i, { type: d.type, to: Number(d.to) || 0 })) after(K);
  }
  function onChoose(K, m) {
    const i = seatOf(K, m), d = m.data || {};
    if (i < 0 || K.t.phase !== 'choose' || d.hand !== K.t.handNo) return;
    if (C.choose(K.t, i, Number(d.d), Number(d.o))) after(K);
  }
  function onBet(K, m) {
    const i = seatOf(K, m), d = m.data || {};
    if (i < 0 || K.game !== 'blackjack' || K.t.phase !== 'bet') return;
    if (C.bjBet(K.t, i, Number(d.amt))) { broadcast(K); maybeDeal(K); }
  }
  function onLeave(K, m) {
    const i = seatOf(K, m); if (i < 0) return;
    K.meta[i].gone = true; K.meta[i].away = true; K.t.seats[i].away = true;
    broadcast(K); pump(K);
  }

  // 판 진행 (포커)
  function nextHand(K) {
    const t = K.t;
    clearTimeout(K.timer);
    // 나간 사람 자리는 AI로, 칩이 떨어진 자리는 다시 채운다
    K.meta.forEach((m, i) => {
      if (i === 0) return;
      if (m.kind === 'human' && m.gone) { const ai = A.newAI(null, t.seats.map((s) => s.name), K.T.start); Object.assign(t.seats[i], ai, { away: false }); K.meta[i] = { kind: 'ai' }; }
      if (t.seats[i].stack <= 0) t.seats[i].stack = K.T.start;
    });
    seatQueued(K);
    if (t.seats[0].stack <= 0) t.seats[0].stack = K.T.start;
    t.rig = {};
    C.newHand(t);
    if (t.phase === 'choose') for (const i of C.inHand(t)) if (K.meta[i].kind === 'ai') C.aiChoose(t, i);
    K.sent = {};
    after(K);
  }
  function after(K) {
    broadcast(K); pump(K); if (A.S === K) A.renderTable();
  }
  function pump(K) {
    const t = K.t;
    clearTimeout(K.timer); K.deadline = 0;
    if (K.game === 'blackjack') return bjPump(K);
    if (t.phase === 'done') { K.deadline = Date.now() + NEXT_MS; K.timer = setTimeout(() => nextHand(K), NEXT_MS); broadcast(K); return; }
    if (t.phase === 'choose') {
      K.deadline = Date.now() + TURN_MS;
      K.timer = setTimeout(() => { for (const i of C.inHand(t)) if (!t.seats[i].chosen) C.aiChoose(t, i); after(K); }, TURN_MS);
      return;
    }
    if (t.phase !== 'bet') return;
    const i = t.toAct, m = K.meta[i];
    if (m.kind === 'ai') {
      K.timer = setTimeout(() => {
        const ok = C.aiAct(t, i); if (!ok) C.act(t, i, { type: 'fold' });
        K.bubbles = { [i]: t.lastAct ? t.lastAct.text : '' };
        setTimeout(() => { K.bubbles = null; if (A.S === K) A.renderTable(); }, 2000);
        after(K);
      }, 700 + Math.random() * 500);
      return;
    }
    const wait = m.away ? 3000 : TURN_MS;
    K.deadline = Date.now() + wait;
    K.timer = setTimeout(() => { const L = C.legal(t, i); if (L) { C.act(t, i, { type: L.canCheck ? 'check' : 'fold' }); after(K); } }, wait);
  }

  // 블랙잭 진행
  function bjBetPhase(K) {
    const t = K.t;
    clearTimeout(K.timer);
    K.meta.forEach((m, i) => { if (m.gone) { t.seats[i].away = true; } });
    seatQueued(K);
    for (const s of t.seats) { if (s.stack <= 0) s.stack = K.T.start; s.bet = 0; s.hands = []; }
    t.phase = 'bet'; t.dealer = { cards: [], hide: true };
    K.deadline = Date.now() + BET_MS;
    K.timer = setTimeout(() => { if (t.seats.some((s) => s.bet > 0)) deal(K); else bjBetPhase(K); }, BET_MS);
    after(K);
  }
  function maybeDeal(K) {
    const t = K.t;
    const present = t.seats.filter((s, i) => !K.meta[i].away && !K.meta[i].gone);
    if (present.length && present.every((s) => s.bet > 0)) deal(K);
  }
  function deal(K) {
    clearTimeout(K.timer);
    if (!C.bjDeal(K.t)) return bjBetPhase(K);
    K.sent = {};
    afterBJ(K);
  }
  function afterBJ(K) { broadcast(K); bjPump(K); if (A.S === K) A.renderTable(); }
  function bjPump(K) {
    const t = K.t;
    clearTimeout(K.timer); K.deadline = 0;
    if (t.phase === 'done') { K.deadline = Date.now() + NEXT_MS; K.timer = setTimeout(() => bjBetPhase(K), NEXT_MS); broadcast(K); return; }
    if (t.phase === 'bet') { K.deadline = Date.now() + BET_MS; return; }
    if (t.phase !== 'play' || !t.turn) return;
    const i = t.turn.seat, m = K.meta[i];
    const wait = m.away ? 3000 : TURN_MS;
    K.deadline = Date.now() + wait;
    K.timer = setTimeout(() => { if (t.turn && t.turn.seat === i) { C.bjAct(t, i, 'stand'); afterBJ(K); } }, wait);
  }

  // 모두에게 판 상태 보내기 + 각자에게 숨은 카드 보내기
  async function broadcast(K, force) {
    const t = K.t;
    const v = K.game === 'blackjack' ? C.viewBJ(t) : C.viewPoker(t);
    if (v.log) v.log = v.log.slice(-5);
    const meta = K.meta.map((m) => ({ kind: m.kind, uid: m.uid || null, peer: m.peer || null }));
    const msg = { seq: ++K.seq, v, meta, deadline: K.deadline, queue: K.queue.map((q) => q.peer) };
    K.room.emit('state', msg).catch(() => {});
    if (K.game === 'blackjack') return;
    for (let i = 1; i < K.meta.length; i++) {
      const m = K.meta[i];
      if (m.kind !== 'human' || m.away) continue;
      if (!m.pub) { const pp = K.room.peers().find((p) => p.peer === m.peer); if (pp && pp.presence && pp.presence.pub) m.pub = pp.presence.pub; else continue; }
      const cards = t.seats[i].cards;
      const sig = t.handNo + ':' + cards.join(',');
      if (!force && K.sent[i] === sig) continue;
      try {
        if (!m.key) m.key = await derive(m.pub);
        const box = await enc(m.key, { hand: t.handNo, cards });
        K.sent[i] = sig;
        K.room.emit('priv', Object.assign({ seat: i, hand: t.handNo }, box)).catch(() => {});
      } catch (e) { /* 키 문제: 다음 기회에 다시 */ }
    }
  }
  function closeHost(K) {
    clearTimeout(K.timer); clearInterval(K.timerI);
    try { K.room.emit('end', {}); } catch (e) { /* 이미 끊김 */ }
    (K.unsubs || []).forEach((u) => { try { u(); } catch (e) { /* 무시 */ } });
    setTimeout(() => { K.room.leave().catch(() => {}); }, 300);
    lobby.presence({ host: null }).catch(() => {});
  }

  // ════════ 손님 ════════
  async function join(code, hostLobbyPeer, game) {
    let room;
    try { room = await lobby.join('velvet-' + code); } catch (e) { return A.toast('방에 들어가지 못했어요.'); }
    await room.presence({ role: 'player', pub, uid: myUid });
    const K = base('client', game, code);
    K.room = room; K.v = null; K.meta = []; K.mine = []; K.mineHand = -1; K.key = null; K.hostPeer = null; K.seq = 0;
    K.unsubs = [
      room.on('state', (m) => {
        if (!isHost(K, m)) return;
        const d = m.data || {};
        if (!d.v || (d.seq && d.seq < K.seq)) return;
        K.seq = d.seq || 0; K.v = d.v; K.meta = d.meta || []; K.deadline = d.deadline || 0; K.queued = (d.queue || []).includes(K.myPeer);
        if (K.v.handNo !== K.mineHand) K.mine = [];
        resolveNames(K, K.meta.map((x) => x.uid));
        if (A.S === K) A.renderTable();
      }),
      room.on('priv', async (m) => {
        if (!isHost(K, m)) return;
        const d = m.data || {};
        if (d.seat !== mySeat(K)) return;
        try {
          if (!K.key) { const hp = room.peers().find((p) => p.peer === m.peer); if (!hp || !hp.presence.pub) return; K.key = await derive(hp.presence.pub); }
          const o = await dec(K.key, d);
          K.mine = o.cards; K.mineHand = o.hand;
          if (A.S === K) A.renderTable();
        } catch (e) { /* 다른 사람 몫이거나 깨진 메시지 */ }
      }),
      room.on('end', (m) => { if (isHost(K, m)) hostGone(K); }),
      room.onPeers((ch) => {
        for (const p of ch.peers) if (p.isMe && p.sameTab) K.myPeer = p.peer;
        if (K.hostPeer && ch.left.some((p) => p.peer === K.hostPeer)) hostGone(K);
      })
    ];
    K.hostLobbyPeer = hostLobbyPeer;
    K.ctx = () => clientCtx(K);
    K.leave = () => { room.emit('leave', {}).catch(() => {}); cleanup(K); };
    K.timerI = setInterval(() => { if (A.S === K && K.deadline) A.renderTable(); }, 1000);
    A.S = K; A.show('scrTable'); A.renderTable();
    // 방장이 누구인지: 이 방에서 role이 host인 사람
    const findHost = () => { const hp = room.peers().find((p) => p.presence && p.presence.role === 'host' && !p.isMe); if (hp) K.hostPeer = hp.peer; return hp; };
    let tries = 0;
    const askSeat = () => {
      if (A.S !== K) return;
      if (findHost()) { room.emit('sit', {}).catch(() => {}); return; }
      if (++tries > 12) { hostGone(K, '방장을 찾지 못했어요.'); return; }
      setTimeout(askSeat, 800);
    };
    askSeat();
  }
  function isHost(K, m) {
    if (!K.hostPeer) { const hp = K.room.peers().find((p) => p.presence && p.presence.role === 'host' && !p.isMe); if (hp) K.hostPeer = hp.peer; }
    return !!K.hostPeer && m.peer === K.hostPeer;
  }
  function mySeat(K) { return K.meta.findIndex((m) => m.kind === 'human' && m.peer === K.myPeer); }
  function cleanup(K) {
    clearInterval(K.timerI);
    (K.unsubs || []).forEach((u) => { try { u(); } catch (e) { /* 무시 */ } });
    setTimeout(() => { K.room.leave().catch(() => {}); }, 300);
  }
  function hostGone(K, why) {
    if (A.S !== K) return;
    cleanup(K); A.S = null;
    A.dialog('테이블이 닫혔어요', [h('p', { class: 'sub', text: why || '방장이 테이블을 떠났어요. 친구 테이블 칩은 지갑과 상관없으니 잃은 건 없어요.' }),
      h('div', { class: 'row' }, h('button', { class: 'btn gold', text: '로비로', onclick: () => { A.closeDialog(); A.show('scrLobby'); A.renderLobby(); } }))], false);
  }
  function clientCtx(K) {
    const v = K.v;
    if (!v) return { v: K.game === 'blackjack' ? { kind: 'bj', phase: 'bet', seats: [], dealer: { cards: [] }, log: [], shoeLeft: 0 } : { game: K.game, seats: [], board: [], pot: 0, phase: 'idle', log: [] }, me: 0, game: K.game, spectate: true, waitingHost: '방장과 연결하는 중이에요…' };
    let me = mySeat(K);
    const names = seatNames(K, v, K.meta);
    if (me < 0) {
      // 아직 자리가 없으면 관전
      const vv = JSON.parse(JSON.stringify(v));
      return { v: vv, me: 0, game: K.game, names, waitingHost: K.queued ? '다음 판부터 자리에 앉아요. 지금은 구경 중이에요.' : '자리를 요청하는 중이에요…', spectate: true };
    }
    if (K.game === 'blackjack') {
      return { v, me, game: 'blackjack', names, timer: timerText(K.deadline), canBet: v.phase === 'bet' && !(v.seats[me].bet > 0),
        bjLegal: () => bjLegalFromView(v, me),
        bjAct: (type) => K.room.emit('act', { type }).catch(() => {}),
        addBet: (n) => { K.bet = Math.max(0, Math.min(K.T.maxBet, v.seats[me].stack, (K.bet || 0) + n)); A.renderTable(); },
        deal: () => K.room.emit('bet', { amt: K.bet }).catch(() => {}) };
    }
    const vv = JSON.parse(JSON.stringify(v));
    const mine = K.mineHand === v.handNo && K.mine.length ? K.mine : null;
    if (mine) vv.seats[me].cards = mine.slice();
    return { v: vv, me, game: K.game, names, mine: mine || vv.seats[me].cards, timer: timerText(K.deadline), bubbles: v.lastAct && v.phase === 'bet' ? { [v.lastAct.seat]: v.lastAct.text } : null,
      legal: () => legalFromView(v, me),
      act: (type, to) => { K.room.emit('act', { type, to, hand: v.handNo }).catch(() => {}); },
      choose: (d, o) => { K.room.emit('choose', { d, o, hand: v.handNo }).catch(() => {}); K.sel = { discard: -1, open: -1 }; } };
  }

  return { open, legalFromView };
})();
window.Friends = Friends;
</script>
<script>
/* ===== 초능력 체스 엔진 =====
   0x88 보드. 백 양수, 흑 음수. 1 폰 2 나이트 3 비숍 4 룩 5 퀸 6 킹.
   칸 번호 = 랭크(0~7) * 16 + 파일(0~7). a1 = 0, h8 = 119. */
const Engine = (() => {
  const PV = [0, 100, 320, 330, 500, 900, 0];
  const KN = [33, 31, 18, 14, -33, -31, -18, -14];
  const KG = [1, -1, 16, -16, 17, 15, -17, -15];
  const DI = [17, 15, -17, -15];
  const OR = [1, -1, 16, -16];
  const ECAP = 5;
  const FEN_CH = { 1: 'P', 2: 'N', 3: 'B', 4: 'R', 5: 'Q', 6: 'K' };
  const CH_FEN = { p: 1, n: 2, b: 3, r: 4, q: 5, k: 6 };

  // 말 위치 점수표 (백 기준, a8부터 h1 순서로 적힘)
  const PST_SRC = {
    1: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5,
        0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    2: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30,
        -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    3: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10,
        -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    4: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
        -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    5: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5,
        0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    6: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
        -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
    7: [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30,
        -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
  };
  // 0x88 칸 번호로 바로 찾을 수 있게 변환 (백용, 흑은 랭크 뒤집기)
  const PST = {};
  for (const k in PST_SRC) {
    PST[k] = new Int16Array(128);
    for (let i = 0; i < 64; i++) {
      const rank = 7 - (i >> 3), file = i & 7;
      PST[k][rank * 16 + file] = PST_SRC[k][i];
    }
  }
  const flip = (sq) => ((7 - (sq >> 4)) << 4) | (sq & 7);

  const sqName = (sq) => 'abcdefgh'[sq & 7] + ((sq >> 4) + 1);
  const sqFrom = (s) => {
    if (typeof s !== 'string' || !/^[a-h][1-8]$/.test(s)) return -1;
    return (s.charCodeAt(1) - 49) * 16 + (s.charCodeAt(0) - 97);
  };
  const onBoard = (sq) => (sq & 0x88) === 0;

  class Game {
    constructor() { this.reset(); }

    reset() {
      this.b = new Int8Array(128);
      const back = [4, 2, 3, 5, 6, 3, 2, 4];
      for (let f = 0; f < 8; f++) {
        this.b[f] = back[f]; this.b[16 + f] = 1;
        this.b[96 + f] = -1; this.b[112 + f] = -back[f];
      }
      this.side = 1; this.castle = 15; this.ep = -1;
      this.en = [1, 1];            // [백, 흑] 에너지
      this.half = 0;
      this.fx = [];                // 지속 효과(대가): {t, side, sq, pv, to, n}
      this.findKings();
      this.stack = [];
    }

    // ── 지속 효과 ──
    // t: freeze(못 움직임) / revert(원래 말로 돌아감) / vanish(사라짐) / exhaust(에너지 안 참)
    // pv: 효과가 걸린 말. 그 칸의 말이 바뀌면 효과도 사라진다.
    frozenAt(sq, side) {
      for (const e of this.fx) if (e.t === 'freeze' && e.side === side && e.sq === sq && this.b[sq] === e.pv) return true;
      return false;
    }
    exhausted(side) { return this.fx.some((e) => e.t === 'exhaust' && e.side === side); }

    // 두는 쪽의 차례가 시작될 때: 효과 시간을 줄이고, 끝난 효과를 처리한다
    startTurn() {
      const side = this.side, out = [], keep = [];
      const NAME = { 1: '폰', 2: '나이트', 3: '비숍', 4: '룩', 5: '퀸', 6: '킹' };
      for (const e of this.fx) {
        if (e.side !== side) { keep.push(e); continue; }
        if (e.t !== 'exhaust' && this.b[e.sq] !== e.pv) continue;      // 그 말이 없어졌으면 효과도 끝
        if (e.n > 0) { e.n--; keep.push(e); continue; }
        const at = e.t === 'exhaust' ? '' : sqName(e.sq) + ' ' + NAME[Math.abs(e.pv)];
        if (e.t === 'freeze') out.push(at + '의 속박이 풀렸다.');
        else if (e.t === 'exhaust') out.push('에너지가 다시 차오르기 시작한다.');
        else if (e.t === 'vanish') { this.b[e.sq] = 0; out.push(at + '이(가) 힘을 다해 사라졌다.'); }
        else if (e.t === 'revert') {
          const r = e.sq >> 4;
          if (e.to === 1 && (r === 0 || r === 7)) out.push(at + '은(는) 끝줄에 있어 원래대로 돌아가지 못했다.');
          else { this.b[e.sq] = e.to * side; out.push(at + '의 변신이 풀려 ' + NAME[e.to] + '(으)로 돌아왔다.'); }
        }
      }
      this.fx = keep;
      this.findKings(); this.fixCastle();
      return out;
    }

    findKings() {
      this.wk = -1; this.bk = -1;
      for (let s = 0; s < 120; s++) {
        if (!onBoard(s)) continue;
        if (this.b[s] === 6) this.wk = s; else if (this.b[s] === -6) this.bk = s;
      }
    }

    clone() {
      const g = Object.create(Game.prototype);
      g.b = new Int8Array(this.b); g.side = this.side; g.castle = this.castle; g.ep = this.ep;
      g.en = this.en.slice(); g.half = this.half; g.wk = this.wk; g.bk = this.bk; g.stack = [];
      g.fx = this.fx.map((e) => Object.assign({}, e));
      return g;
    }

    toJSON() {
      return { b: Array.from(this.b), side: this.side, castle: this.castle, ep: this.ep, en: this.en.slice(), half: this.half,
        fx: this.fx.map((e) => Object.assign({}, e)) };
    }
    static fromJSON(o) {
      const g = new Game();
      g.b = Int8Array.from(o.b); g.side = o.side; g.castle = o.castle; g.ep = o.ep; g.en = o.en.slice(); g.half = o.half || 0;
      g.fx = (o.fx || []).map((e) => Object.assign({}, e));
      g.findKings(); return g;
    }

    loadFEN(fen) {
      const [pos, side, cas, ep] = fen.split(' ');
      this.b = new Int8Array(128);
      let r = 7, f = 0;
      for (const c of pos) {
        if (c === '/') { r--; f = 0; continue; }
        if (c >= '1' && c <= '8') { f += +c; continue; }
        const v = CH_FEN[c.toLowerCase()];
        this.b[r * 16 + f] = c === c.toUpperCase() ? v : -v; f++;
      }
      this.side = side === 'w' ? 1 : -1;
      this.castle = (cas.includes('K') ? 1 : 0) | (cas.includes('Q') ? 2 : 0) | (cas.includes('k') ? 4 : 0) | (cas.includes('q') ? 8 : 0);
      this.ep = ep && ep !== '-' ? sqFrom(ep) : -1;
      this.findKings(); this.stack = [];
    }

    // by 쪽(1 백, -1 흑)이 sq를 공격하는지 (평범한 체스 규칙 기준)
    attacked(sq, by) {
      const b = this.b;
      if (by === 1) {
        if (onBoard(sq - 15) && b[sq - 15] === 1) return true;
        if (onBoard(sq - 17) && b[sq - 17] === 1) return true;
      } else {
        if (onBoard(sq + 15) && b[sq + 15] === -1) return true;
        if (onBoard(sq + 17) && b[sq + 17] === -1) return true;
      }
      for (const d of KN) { const t = sq + d; if (onBoard(t) && b[t] === 2 * by) return true; }
      for (const d of KG) { const t = sq + d; if (onBoard(t) && b[t] === 6 * by) return true; }
      for (const d of DI) {
        let t = sq + d;
        while (onBoard(t)) { const p = b[t]; if (p) { if (p === 3 * by || p === 5 * by) return true; break; } t += d; }
      }
      for (const d of OR) {
        let t = sq + d;
        while (onBoard(t)) { const p = b[t]; if (p) { if (p === 4 * by || p === 5 * by) return true; break; } t += d; }
      }
      return false;
    }

    inCheck(side = this.side) {
      const k = side === 1 ? this.wk : this.bk;
      return k >= 0 && this.attacked(k, -side);
    }

    // 수: {f, t, p(프로모션 말 종류), fl: 1 앙파상, 2 캐슬링, 4 두 칸 전진}
    pseudo(capsOnly = false) {
      const b = this.b, us = this.side, out = [];
      const push = (f, t, fl = 0, p = 0) => out.push({ f, t, fl, p });
      const prRank = us === 1 ? 7 : 0, stRank = us === 1 ? 1 : 6, fw = us === 1 ? 16 : -16;
      for (let f = 0; f < 120; f++) {
        if (!onBoard(f)) { f += 7; continue; }
        const pc = b[f] * us;
        if (pc <= 0) continue;
        if (this.fx.length && this.frozenAt(f, us)) continue;   // 속박된 말은 못 움직인다
        if (pc === 1) {
          const t = f + fw;
          if (onBoard(t) && !b[t] && !capsOnly) {
            if ((t >> 4) === prRank) { for (const p of [5, 4, 3, 2]) push(f, t, 0, p); }
            else {
              push(f, t);
              const t2 = t + fw;
              if ((f >> 4) === stRank && onBoard(t2) && !b[t2]) push(f, t2, 4);
            }
          } else if (onBoard(t) && !b[t] && capsOnly && (t >> 4) === prRank) push(f, t, 0, 5);
          for (const d of [fw + 1, fw - 1]) {
            const c = f + d;
            if (!onBoard(c)) continue;
            if (b[c] * us < 0 && Math.abs(b[c]) !== 6) {
              if ((c >> 4) === prRank) { for (const p of (capsOnly ? [5] : [5, 4, 3, 2])) push(f, c, 0, p); }
              else push(f, c);
            } else if (c === this.ep && !b[c]) push(f, c, 1);
          }
        } else if (pc === 2 || pc === 6) {
          for (const d of (pc === 2 ? KN : KG)) {
            const t = f + d;
            if (!onBoard(t)) continue;
            const q = b[t] * us;
            if (q > 0 || Math.abs(b[t]) === 6) continue;
            if (capsOnly && !q) continue;
            push(f, t);
          }
          if (pc === 6 && !capsOnly) this.castles(f, push);
        } else {
          const dirs = pc === 3 ? DI : pc === 4 ? OR : KG;
          for (const d of dirs) {
            let t = f + d;
            while (onBoard(t)) {
              const q = b[t] * us;
              if (q > 0) break;
              if (q < 0) { if (Math.abs(b[t]) !== 6) push(f, t); break; }
              if (!capsOnly) push(f, t);
              t += d;
            }
          }
        }
      }
      return out;
    }

    castles(f, push) {
      const b = this.b, us = this.side;
      const home = us === 1 ? 4 : 116;
      if (f !== home || this.attacked(f, -us)) return;
      const ks = us === 1 ? 1 : 4, qs = us === 1 ? 2 : 8;
      const fr = (s) => this.fx.length && this.frozenAt(s, us);
      if ((this.castle & ks) && !fr(f + 3) && b[f + 3] === 4 * us && !b[f + 1] && !b[f + 2] &&
          !this.attacked(f + 1, -us) && !this.attacked(f + 2, -us)) push(f, f + 2, 2);
      if ((this.castle & qs) && !fr(f - 4) && b[f - 4] === 4 * us && !b[f - 1] && !b[f - 2] && !b[f - 3] &&
          !this.attacked(f - 1, -us) && !this.attacked(f - 2, -us)) push(f, f - 2, 2);
    }

    set(sq, v) {
      this.log.push(sq, this.b[sq]);
      this.b[sq] = v;
      if (v === 6) this.wk = sq; else if (v === -6) this.bk = sq;
    }

    begin() {
      if (!this.log) this.log = [];
      this.stack.push([this.log.length, this.side, this.castle, this.ep, this.en[0], this.en[1], this.half, this.wk, this.bk]);
    }

    undo() {
      const fr = this.stack.pop();
      while (this.log.length > fr[0]) {
        const old = this.log.pop(), sq = this.log.pop();
        this.b[sq] = old;
      }
      [, this.side, this.castle, this.ep, this.en[0], this.en[1], this.half, this.wk, this.bk] = fr;
    }

    fixCastle() {
      const b = this.b;
      if (b[4] !== 6) this.castle &= ~3;
      if (b[7] !== 4) this.castle &= ~1;
      if (b[0] !== 4) this.castle &= ~2;
      if (b[116] !== -6) this.castle &= ~12;
      if (b[119] !== -4) this.castle &= ~4;
      if (b[112] !== -4) this.castle &= ~8;
    }

    // 평범한 수 두기. 두고 나서 자기 킹이 공격받으면 되돌리고 false
    make(m) {
      this.begin();
      const b = this.b, us = this.side, pc = b[m.f];
      const cap = b[m.t];
      this.set(m.t, m.p ? m.p * us : pc);
      this.set(m.f, 0);
      if (m.fl & 1) this.set(m.t - (us === 1 ? 16 : -16), 0);
      if (m.fl & 2) {
        if (m.t > m.f) { this.set(m.f + 1, b[m.f + 3]); this.set(m.f + 3, 0); }
        else { this.set(m.f - 1, b[m.f - 4]); this.set(m.f - 4, 0); }
      }
      this.ep = (m.fl & 4) ? (m.f + m.t) >> 1 : -1;
      this.half = (Math.abs(pc) === 1 || cap) ? 0 : this.half + 1;
      this.fixCastle();
      const i = us === 1 ? 0 : 1;
      if (!(this.fx.length && this.exhausted(us))) this.en[i] = Math.min(ECAP, this.en[i] + 1);
      this.side = -us;
      if (this.inCheck(us)) { this.undo(); return false; }
      return true;
    }

    legal() {
      const out = [];
      for (const m of this.pseudo()) { if (this.make(m)) { this.undo(); out.push(m); } }
      return out;
    }

    // ── 평가: 백 기준 점수를 두는 쪽 기준으로 돌려준다 ──
    evaluate() {
      const b = this.b;
      let s = 0, nonPawn = 0;
      for (let q = 0; q < 120; q++) {
        if (!onBoard(q)) { q += 7; continue; }
        const p = b[q]; if (!p) continue;
        const a = Math.abs(p);
        if (a !== 1 && a !== 6) nonPawn += PV[a];
      }
      const endgame = nonPawn <= 1600;
      for (let q = 0; q < 120; q++) {
        if (!onBoard(q)) { q += 7; continue; }
        const p = b[q]; if (!p) continue;
        const a = Math.abs(p);
        const tbl = PST[a === 6 && endgame ? 7 : a];
        if (p > 0) s += PV[a] + tbl[q];
        else s -= PV[a] + tbl[flip(q)];
      }
      s += (this.en[0] - this.en[1]) * 12;
      return s * this.side;
    }

    // ── 탐색 ──
    search(opts = {}) {
      const timeMs = opts.timeMs || 800, maxDepth = opts.maxDepth || 6, noise = opts.noise || 0;
      const MATE = 100000, t0 = Date.now();
      let nodes = 0, stop = false;
      const killers = [];
      const order = (ms, ply, pv) => {
        for (const m of ms) {
          const v = this.b[m.t];
          m.s = 0;
          if (pv && m.f === pv.f && m.t === pv.t && m.p === pv.p) m.s = 1e6;
          else if (v || (m.fl & 1)) m.s = 1e5 + PV[Math.abs(v) || 1] * 10 - PV[Math.abs(this.b[m.f])];
          else if (m.p) m.s = 9e4;
          else if (killers[ply] && killers[ply].some(k => k.f === m.f && k.t === m.t)) m.s = 8e4;
        }
        ms.sort((a, c) => c.s - a.s);
      };
      const tick = () => { if ((++nodes & 1023) === 0 && Date.now() - t0 > timeMs) stop = true; };
      const quies = (alpha, beta, depth) => {
        tick(); if (stop) return 0;
        const stand = this.evaluate();
        if (stand >= beta) return beta;
        if (stand > alpha) alpha = stand;
        if (depth > 6) return alpha;
        const ms = this.pseudo(true); order(ms, 99, null);
        for (const m of ms) {
          if (!this.make(m)) continue;
          const sc = -quies(-beta, -alpha, depth + 1);
          this.undo();
          if (stop) return 0;
          if (sc >= beta) return beta;
          if (sc > alpha) alpha = sc;
        }
        return alpha;
      };
      const neg = (depth, alpha, beta, ply) => {
        tick(); if (stop) return 0;
        const check = this.inCheck();
        if (check) depth++;
        if (depth <= 0) return quies(alpha, beta, 0);
        const ms = this.pseudo(); order(ms, ply, null);
        let any = false;
        for (const m of ms) {
          if (!this.make(m)) continue;
          any = true;
          const sc = -neg(depth - 1, -beta, -alpha, ply + 1);
          this.undo();
          if (stop) return 0;
          if (sc >= beta) {
            if (!this.b[m.t]) { (killers[ply] = killers[ply] || []).unshift(m); killers[ply].length = 2; }
            return beta;
          }
          if (sc > alpha) alpha = sc;
        }
        if (!any) return check ? -MATE + ply : 0;
        return alpha;
      };
      const root = this.legal();
      if (!root.length) return null;
      let best = root[0], bestScore = -Infinity, pv = null;
      for (let d = 1; d <= maxDepth; d++) {
        order(root, 0, pv);
        let alpha = -Infinity, iterBest = null, iterScore = -Infinity;
        for (const m of root) {
          this.make(m);
          let sc = -neg(d - 1, -Infinity, -alpha, 1);
          this.undo();
          if (stop) break;
          if (noise) sc += (Math.random() * 2 - 1) * noise;
          if (sc > iterScore) { iterScore = sc; iterBest = m; }
          if (sc > alpha) alpha = sc;
        }
        if (stop && !iterBest) break;
        if (iterBest) { best = iterBest; bestScore = iterScore; pv = iterBest; }
        if (stop || Math.abs(bestScore) > MATE - 100) break;
      }
      return { move: best, score: bestScore, nodes };
    }

    // ── 초능력: 판 변화 검사와 적용 ──
    // changes: [{sq:"e4", to:"N"|"n"|null}], who: 1 백 / -1 흑
    checkAbility(changes, who, cost, risks) {
      const NAME = { 1: '폰', 2: '나이트', 3: '비숍', 4: '룩', 5: '퀸', 6: '킹' };
      if (!Array.isArray(changes) || !changes.length) return { ok: false, reason: '판에 아무 변화가 없어요.' };
      if (changes.length > 8) return { ok: false, reason: '한 번에 바뀌는 칸이 너무 많아요.' };
      cost = Math.round(Number(cost));
      if (!(cost >= 1 && cost <= 3)) return { ok: false, reason: '비용이 1~3 범위를 벗어났어요.' };
      const i = who === 1 ? 0 : 1;
      if (cost > this.en[i]) return { ok: false, reason: `에너지가 부족해요. (필요 ${cost}, 남은 ${this.en[i]})` };
      const g = this.clone(); g.log = []; g.stack = [];
      const seen = new Set();
      let enemyLost = 0;
      for (const c of changes) {
        const sq = sqFrom(String(c.sq || '').toLowerCase());
        if (sq < 0) return { ok: false, reason: `칸 이름이 이상해요: ${c.sq}` };
        if (seen.has(sq)) return { ok: false, reason: `같은 칸이 두 번 바뀌어요: ${c.sq}` };
        seen.add(sq);
        let v = 0;
        if (c.to) {
          const ch = String(c.to).trim()[0];
          const k = CH_FEN[(ch || '').toLowerCase()];
          if (!k) return { ok: false, reason: `알 수 없는 말이에요: ${c.to}` };
          v = ch === ch.toUpperCase() ? k : -k;
        }
        const old = g.b[sq];
        if (old === -6 * who || v === -6 * who) return { ok: false, reason: '상대 킹은 능력으로 건드릴 수 없어요.' };
        if (old * who < 0 && v !== old) enemyLost++;
        g.b[sq] = v;
      }
      if (enemyLost > 2) return { ok: false, reason: '상대 말은 한 번에 두 개까지만 없애거나 바꿀 수 있어요.' };
      // 폰 위치: 끝 랭크 도착은 퀸, 자기 진영 끝은 불가
      for (let r = 0; r < 8; r += 7) for (let f = 0; f < 8; f++) {
        const sq = r * 16 + f, p = g.b[sq];
        if (Math.abs(p) !== 1) continue;
        if ((p === 1 && r === 7) || (p === -1 && r === 0)) g.b[sq] = 5 * p;
        else return { ok: false, reason: '폰은 자기 쪽 맨 끝 줄에 놓을 수 없어요.' };
      }
      let wk = 0, bk = 0;
      for (let s = 0; s < 120; s++) { if (!onBoard(s)) continue; if (g.b[s] === 6) wk++; if (g.b[s] === -6) bk++; }
      if (wk !== 1 || bk !== 1) return { ok: false, reason: '킹은 양쪽에 하나씩 있어야 해요.' };
      g.findKings();
      if (g.inCheck(who)) return { ok: false, reason: '이 능력을 쓰면 내 킹이 공격받는 상태가 돼요.' };
      // 바뀐 칸에 걸려 있던 효과는 없앤다
      g.fx = g.fx.filter((e) => e.t === 'exhaust' || !seen.has(e.sq));
      // 대가(리스크): 선언한 쪽에게만, 최대 3개
      const added = [];
      if (risks != null && !Array.isArray(risks)) return { ok: false, reason: '대가 형식이 이상해요.' };
      if (risks && risks.length > 3) return { ok: false, reason: '대가는 최대 세 개까지예요.' };
      for (const r of risks || []) {
        const t = String(r.type || r.t || '').toLowerCase();
        if (!['freeze', 'revert', 'vanish', 'exhaust'].includes(t)) return { ok: false, reason: `알 수 없는 대가예요: ${t}` };
        const n = Math.round(Number(r.turns));
        if (!(n >= 1 && n <= 4)) return { ok: false, reason: '대가의 턴 수는 1~4 사이여야 해요.' };
        if (t === 'exhaust') { added.push({ t, side: who, n }); continue; }
        const sq = sqFrom(String(r.sq || '').toLowerCase());
        if (sq < 0 || g.b[sq] * who <= 0) return { ok: false, reason: '대가는 내 말에게만 걸 수 있어요.' };
        const a = Math.abs(g.b[sq]);
        if (a === 6 && t !== 'freeze') return { ok: false, reason: '킹은 사라지거나 변할 수 없어요.' };
        const e = { t, side: who, sq, pv: g.b[sq], n };
        if (t === 'revert') {
          const k = CH_FEN[String(r.to || '').trim().toLowerCase()[0]];
          if (!k || k === 6) return { ok: false, reason: '되돌아갈 말 종류가 이상해요.' };
          if (k === a) return { ok: false, reason: '이미 그 말이라 되돌아갈 게 없어요.' };
          e.to = k;
        }
        added.push(e);
      }
      // 내 다음 차례부터 n번의 차례 동안 걸리고, 그다음 차례가 시작될 때 끝난다
      for (const e of added) g.fx.push(e);
      g.fixCastle();
      g.ep = -1; g.half = 0;
      g.en[i] -= cost;
      g.side = -who;
      return { ok: true, game: g, cost, risks: added };
    }

    // 킹 말고 남은 말 수
    army(side) {
      let n = 0;
      for (let s = 0; s < 120; s++) { if (!onBoard(s)) continue; const p = this.b[s] * side; if (p > 0 && p !== 6) n++; }
      return n;
    }

    // 지속 효과를 사람이 읽을 글로 (심판에게 보낼 용도)
    fxText() {
      if (!this.fx.length) return '없음';
      const NAME = { 1: '폰', 2: '나이트', 3: '비숍', 4: '룩', 5: '퀸', 6: '킹' };
      const TN = { freeze: '움직일 수 없음', revert: '변신이 풀림', vanish: '사라짐', exhaust: '에너지가 차지 않음' };
      return this.fx.map((e) => {
        const who = e.side === 1 ? '백' : '흑';
        const head = e.t === 'exhaust' ? who : `${who} ${sqName(e.sq)} ${NAME[Math.abs(e.pv)]}`;
        return `${head}: ${TN[e.t]}${e.t === 'revert' ? '(→' + NAME[e.to] + ')' : ''} · ${this.fxLeft(e)}`;
      }).join('\n');
    }

    // 효과가 얼마나 남았는지 (그 효과가 걸린 쪽의 차례 기준)
    fxLeft(e) {
      const left = e.n + (e.side === this.side ? 1 : 0);
      const lasting = e.t === 'freeze' || e.t === 'exhaust';
      if (lasting) return left > 0 ? `앞으로 ${left}턴` : '다음 차례에 풀림';
      return left > 0 ? `${left}턴 더 버팀` : '다음 차례 시작에 발동';
    }

    // 평범한 수가 하나도 없는지
    noMoves() { return this.legal().length === 0; }

    onlyKings() {
      for (let s = 0; s < 120; s++) { if (!onBoard(s)) continue; const a = Math.abs(this.b[s]); if (a && a !== 6) return false; }
      return true;
    }

    key() { return Array.from(this.b).join(',') + this.side + '|' + this.castle + '|' + this.ep; }

    // 사람이 읽을 판 그림 (심판에게 보낼 용도)
    diagram() {
      const rows = [];
      for (let r = 7; r >= 0; r--) {
        let line = (r + 1) + ' |';
        for (let f = 0; f < 8; f++) {
          const p = this.b[r * 16 + f];
          line += ' ' + (p ? (p > 0 ? FEN_CH[p] : FEN_CH[-p].toLowerCase()) : '.');
        }
        rows.push(line);
      }
      rows.push('    a b c d e f g h');
      const list = { 1: [], '-1': [] };
      for (let r = 7; r >= 0; r--) for (let f = 0; f < 8; f++) {
        const p = this.b[r * 16 + f]; if (!p) continue;
        list[p > 0 ? 1 : -1].push(FEN_CH[Math.abs(p)] + sqName(r * 16 + f));
      }
      return rows.join('\n') + '\n백(대문자): ' + list[1].join(' ') + '\n흑(소문자): ' + list[-1].join(' ');
    }

    // 표기: 피스 기호 + 출발→도착
    san(m) {
      const pc = Math.abs(this.b[m.f]);
      if (m.fl & 2) return m.t > m.f ? 'O-O' : 'O-O-O';
      const cap = this.b[m.t] || (m.fl & 1);
      const L = { 1: '', 2: 'N', 3: 'B', 4: 'R', 5: 'Q', 6: 'K' };
      let s = L[pc] + sqName(m.f) + (cap ? 'x' : '-') + sqName(m.t);
      if (m.p) s += '=' + L[m.p];
      return s;
    }
  }

  // 수 개수 세기 (규칙 검증용)
  function perft(g, d) {
    if (d === 0) return 1;
    let n = 0;
    for (const m of g.pseudo()) { if (g.make(m)) { n += perft(g, d - 1); g.undo(); } }
    return n;
  }

  return { Game, perft, sqName, sqFrom, ECAP, PV };

      await sleep(c === 0 ? 650 : 380);
      clearInterval(timers[c]);
      if (cols[c]) [...cols[c].children].forEach((s, r) => { const x = fin[c][r]; s.textContent = x.s; s.className = 'sym y-' + x.k + (r === 1 ? ' mid' : ''); });
    }
    SL.grid = fin;
    const line = fin.map((col) => col[1].k);
    let back = 0, msg = '', jp = false;
    if (line[0] === line[1] && line[1] === line[2]) {
      const k = line[0];
      if (k === 'seven') { back = w.slot.pool + bet * 100; msg = '잭팟!!! ' + fmt(back) + '칩'; w.slot.pool = 500; jp = true; P.inc('sl777'); }
      else if (k === 'gift') { const r = Math.random(); const n = r < 0.75 ? giveAuction(RARE) : r < 0.97 ? giveAuction(LEGEND) : (P.auction.deliver('blackchip'), '검은 칩'); msg = '🎁🎁🎁 경매장 물건: ' + (n || giveShop(3)); P.inc('slItem'); }
      else { back = bet * PAY3[k]; msg = PAY3[k] + '배! ' + fmt(back) + '칩'; if (k === 'cherry') P.inc('slCherry'); }
    } else if (line[0] === 'cherry' && line[1] === 'cherry') { back = bet * 2; msg = '체리 두 개 · ' + fmt(back) + '칩'; }
    else if (line[0] === 'cherry') { back = bet; msg = '체리 하나 · 본전'; }
    const gifts = line.filter((k) => k === 'gift').length;
    if (gifts === 2) { msg = (msg ? msg + ' · ' : '') + '🎁 ' + giveShop(1); P.inc('slItem'); }
    if (!msg) msg = '꽝';
    w.chips += back;
    P.inc('slSpin');
    const px = P.settle({ game: 'slots', net: back - bet, staked: bet, folded: false });
    SL.msg = msg + (px ? ' (효과 ' + (px > 0 ? '+' : '') + fmt(px) + ')' : '');
    SL.busy = false;
    A.renderTop();
    if (!P.isOn('sl')) { SL.auto = 0; return; }
    openSlots();
    if (jp) document.querySelector('.machine').classList.add('jackpot');
    if (SL.auto > 0) { SL.auto--; if (SL.auto > 0) { await sleep(500); if (P.isOn('sl') && SL.auto > 0) spinSlots(); else openSlots(); } else openSlots(); }
  }

  // ════════════════ 지하 테이블 ════════════════
  const UG_T = [
    { id: 'ug1', name: '지하', sb: 5, bb: 10, min: 500, max: 5000, info: '블라인드 5/10 · 바이인 500~5,000' },
    { id: 'ug2', name: '깊은 지하', sb: 25, bb: 50, min: 2000, max: 20000, info: '블라인드 25/50 · 바이인 2,000~20,000' }
  ];
  const MARKET = [
    { id: 'marked', price: 180 }, { id: 'ring', price: 150 }, { id: 'fake', price: 200 },
    { id: 'lens', price: 30 }, { id: 'sleeve', price: 90 }, { id: 'cigarette', price: 55 }
  ];
  const TELL = {
    ace: ['손이 소매 쪽으로 갔다', '카드를 너무 오래 쥐고 있다', '소매 끝이 불룩하다'],
    smoke: ['갑자기 담배 연기가 짙어졌다', '연기 너머로 손이 바쁘다'],
    fake: ['칩 색이 조금 다르다']
  };
  const FAKE = ['헛기침을 했다', '넥타이를 고쳐 맸다', '시계를 들여다본다', '손톱으로 테이블을 두드린다'];
  const unlocked = () => (W().st.t13Visit || 0) >= 1;
  function openUnder() {
    const w = W(), today = A.dayKey();
    const el = P.screen('지하', '계단 아래, 담배 연기와 낮은 조명. 여기엔 의심 게이지가 없어요. 대신 아이템을 쓸 때마다 30% 확률로 걸려요.', 'ug-screen');
    if (w.ug.ban === today) {
      el.append(h('div', { class: 'panel' }, h('h3', { text: '오늘은 내려갈 수 없어요' }), h('p', { class: 'note', text: '문지기가 당신 얼굴을 기억해요. 내일 아침 6시 이후에 다시 오세요. 오늘 하루는 위층 의심도 50 아래로 내려가지 않아요.' })));
      return;
    }
    const tables = h('div', { class: 'paths ug-paths' });
    for (const T of UG_T) {
      tables.append(h('div', { class: 'path ug' }, h('span', { class: 'arch' }), h('h2', { text: '홀덤 · ' + T.name }), h('p', { class: 'rules', text: '손님들도 아이템을 써요. 낌새가 보이면 고발하세요. 맞으면 그 손님 칩의 절반이 내 것, 틀리면 내 칩의 20%가 벌금.' }),
        h('div', { class: 'tierinfo', text: T.info + (w.chips < T.min ? ' · 칩이 부족해요' : '') }),
        h('button', { class: 'btn gold', text: '앉기', disabled: w.chips < T.min, onclick: () => askBuy(T) })));
    }
    el.append(tables);
    const mk = h('div', { class: 'shop-grid' });
    for (const m of MARKET) {
      const it = A.ITEMS[m.id];
      mk.append(h('div', { class: 'ware ug-ware' }, h('div', { class: 'head' }, h('span', { class: 'ico', svg: A.icon(m.id, 26) }), h('div', null, h('h3', { text: it.name }), h('div', { class: 'kind cheat', text: it.under ? '암시장 전용' : '암시장 할인' }))),
        h('p', { text: typeof it.desc === 'string' ? it.desc : it.desc.holdem }),
        h('div', { class: 'foot' }, h('span', { class: 'own', text: '가진 것 ' + (w.items[m.id] || 0) + '개' }),
          h('button', { class: 'btn small gold', disabled: w.chips < m.price, onclick: () => { if (w.chips < m.price) return; w.chips -= m.price; w.items[m.id] = (w.items[m.id] || 0) + 1; P.inc('market'); A.save(); A.renderTop(); P.check(); A.toast(it.name + '을(를) 샀어요.'); openUnder(); } }, h('span', { class: 'chip-ico' }), ' ' + fmt(m.price)))));
    }
    el.append(h('h2', { text: '암시장', style: 'margin:24px 0 10px' }), h('p', { class: 'note', text: '여기서 산 물건도 지하에서 쓰면 30% 확률로 걸려요. 암시장 전용 물건은 지하에서만 쓸 수 있어요.', style: 'margin-bottom:10px' }), mk);
  }
  function askBuy(T) {
    const w = W();
    const max = Math.min(T.max, w.chips), def = Math.min(max, Math.max(T.min, T.bb * 100));
    const r = h('input', { type: 'range', min: String(T.min), max: String(max), step: String(T.bb), value: String(def), 'aria-label': '가져갈 칩' });
    const out = h('b', { class: 'num', text: fmt(def) });
    r.oninput = () => { out.textContent = fmt(r.value); };
    A.dialog('지하 · ' + T.name, [h('p', { class: 'sub', text: '가져갈 칩을 정하세요. 걸리면 이 칩은 전부 잃어요.' }), h('div', { class: 'stat' }, '가져갈 칩 ', out), r,
      h('div', { class: 'row' }, h('button', { class: 'btn gold', text: '내려간다', onclick: () => { A.closeDialog(); P.stopAll(); A.sitPoker('holdem', T, Number(r.value), { under: true }); P.inc('ugSit'); } }))]);
  }
  // 판이 시작될 때: 손님들의 속임수
  function handStart(S, t) {
    S.cheated = {}; S.tells = {}; S.accused = false; S.ugEject = [];
    t.seats.forEach((s, i) => {
      if (!i || s.folded || !s.cards.length) return;
      if (Math.random() < 0.15) {
        const kind = rand(['ace', 'smoke']);
        const lo = s.cards[0] >> 2 <= s.cards[1] >> 2 ? 0 : 1;
        if (kind === 'ace') { const k = t.deck.findIndex((c) => (c >> 2) === 12); if (k >= 0) { const old = s.cards[lo]; s.cards[lo] = t.deck[k]; t.deck[k] = old; } }
        else { const old = s.cards[lo]; s.cards[lo] = t.deck.shift(); t.deck.push(old); }
        if (Math.random() < 0.3) { eject(S, t, i, '경비원이 ' + s.name + '을(를) 끌고 나갔어요. ' + (kind === 'ace' ? '소매에서 에이스가 나왔대요.' : '연기 속 바꿔치기가 들켰대요.')); return; }
        S.cheated[i] = kind;
        if (Math.random() < 0.7) S.tells[i] = rand(TELL[kind]);
      } else if (Math.random() < 0.07) S.tells[i] = rand(FAKE);
    });
  }
  // 손님 퇴장: 칩은 남은 사람들끼리 나눈다
  function eject(S, t, i, msg, toMe) {
    const s = t.seats[i]; if (!s || s.folded && s.stack <= 0) return;
    let pool = s.stack;
    if (t.toAct === i && t.phase === 'bet') { A.C.act(t, i, { type: 'fold' }); }
    s.folded = true;
    s.stack = 0;
    if (toMe != null) { t.seats[0].stack += toMe; pool = 0; }
    const others = t.seats.map((x, k) => k).filter((k) => k !== i && t.seats[k].stack > 0 || k === 0);
    if (pool > 0 && others.length) { const share = Math.floor(pool / others.length); for (const k of others) t.seats[k].stack += share; }
    if (W().table) W().table.stack = t.seats[0].stack;
    A.save();
    A.toast(msg);
  }
  function accuse(i) {
    const S = A.S; if (!S || !S.under || S.accused) return;
    const t = S.t, s = t.seats[i]; S.accused = true;
    if (S.cheated[i]) {
      const gain = Math.floor(s.stack / 2);
      P.inc('ugAccuse');
      eject(S, t, i, '고발 성공! ' + s.name + '의 소매에서 증거가 나왔어요. ' + fmt(gain) + '칩을 받았어요.', gain);
    } else {
      const me = t.seats[0], fine = Math.floor(me.stack * 0.2);
      me.stack -= fine; if (W().table) W().table.stack = me.stack; P.inc('ugFalse');
      A.toast('헛다리였어요. 벌금 ' + fmt(fine) + '칩.');
      delete S.tells[i];
    }
    A.save(); P.check(); A.renderTable();
  }
  function panel(S) {
    const t = S.t;
    const box = h('div', { class: 'chooser ug-acc' }, h('b', { text: '고발 · 한 판에 한 번' }));
    if (!(t.phase === 'bet' || t.phase === 'choose')) { box.append(h('p', { class: 'note', text: '판이 진행 중일 때 고발할 수 있어요.' })); return box; }
    if (S.accused) { box.append(h('p', { class: 'note', text: '이번 판엔 이미 고발했어요.' })); return box; }
    const r = h('div', { class: 'row' });
    t.seats.forEach((s, i) => { if (i && !s.folded) r.append(h('button', { class: 'btn small' + (S.tells[i] ? ' red' : ''), text: s.name + (S.tells[i] ? ' ⚠' : ''), onclick: () => accuse(i) })); });
    box.append(r, h('p', { class: 'note', text: '⚠는 낌새가 보인 손님이에요. 맞으면 그 손님 칩의 절반, 틀리면 내 칩의 20%를 벌금으로.' }));
    return box;
  }
  // 아이템을 쓸 때마다: 30% 확률로 적발
  function onItem() {
    const s = W().st;
    if (Math.random() < 0.3) { s.ugCleanRun = 0; setTimeout(caught, 450); return false; }
    s.ugCleanRun = (s.ugCleanRun || 0) + 1; s.ugCleanBest = Math.max(s.ugCleanBest || 0, s.ugCleanRun);
    P.check();
    return true;
  }
  function caught() {
    const S = A.S, w = W(), today = A.dayKey();
    if (!S || !S.under) return;
    A.stopTimers();
    const lost = S.t.seats[0].stack;
    S.t.seats[0].stack = 0; w.table = null; A.S = null;
    w.ug.ban = today; w.ug.floor = today; w.sus = Math.max(w.sus, 50);
    P.inc('ugCaught'); A.save(); A.renderTop(); P.check();
    A.dialog('지하 문지기가 팔을 붙잡습니다', [h('p', { class: 'sub', text: '아이템을 쓰다 들켰어요. 가져온 칩 ' + fmt(lost) + '칩을 전부 잃었어요. 오늘은 지하에 다시 내려올 수 없고, 하루 동안 의심이 50 아래로 내려가지 않아요.' }),
      h('div', { class: 'row' }, h('button', { class: 'btn gold', text: '위층으로', onclick: () => { A.closeDialog(); A.show('scrLobby'); A.renderLobby(); } }))], false);
  }

  P.wheel = { open: openWheel, pending, banner };
  P.baccarat = { open: openBaccarat, btot, bval };
  P.slots = { open: openSlots, SYM };
  P.under = { open: openUnder, unlocked, handStart, panel, onItem, caught, accuse, TELL };
})();
</script>
<script>App.boot();</script>
